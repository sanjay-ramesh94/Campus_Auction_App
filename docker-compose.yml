version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: campus_auction_mongo
    restart: always
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'rs.status().ok' || mongosh --eval 'rs.initiate()'"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 5s

volumes:
  mongo_data:
